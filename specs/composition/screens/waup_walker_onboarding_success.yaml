spec_version: "1.0.0"
namespace: "waup"

screens:
  # COMPOSICIÓN DE PANTALLA: Registro Exitoso del Walker
  waup_walker_onboarding_success:
    description: "Pantalla final que confirma que el paseador ha sido registrado y verificado con éxito."
    role: "waup_walker"
    view_state: "waup_walker_onboarding_success"
    
    layout:
      type: "scroller"
      density: "comfortable"
      background_color: "brand_colors.neutrals.background"
      
    composition:
      - slot_id: "success_hero"
        description: "Contenedor de feedback visual de éxito con confeti y checkmark."
        properties:
          title: "¡Verificación Completada!"
          subtitle: "Tu cuenta de Walker ha sido activada y verificada de manera satisfactoria. Ya puedes comenzar a pasear mascotas."
          
      - slot_id: "finish_action"
        component: "component.button"
        properties:
          label: "Comenzar a Pasear"
          action: "navigate_to:waup_walker_home"
          hierarchy: "primary"

spec_version: "1.0.0"
namespace: "waup"

screens:
  # COMPOSICIÓN DE PANTALLA: Inicio del Onboarding del Walker
  waup_walker_onboarding_start:
    description: "Pantalla de bienvenida y presentación de los 3 pasos para el registro del Walker."
    role: "waup_walker"
    view_state: "waup_walker_onboarding_start"
    
    layout:
      type: "scroller"
      density: "comfortable"
      background_color: "brand_colors.neutrals.background"
      
    composition:
      - slot_id: "navigation_header"
        pattern: "waup.nav-header"
        properties:
          title: "Registro de Walker"
          back_action: "navigate_to:waup_role_selection"
          variant: "ghost"
          
      - slot_id: "welcome_hero"
        description: "Cabecera informativa con resumen de los pasos obligatorios."
        properties:
          title: "¡Conviértete en Walker!"
          subtitle: "Completa el registro rápido en 3 pasos simples para empezar a pasear mascotas."
          
      - slot_id: "steps_list"
        description: "Lista secuencial de los 3 pasos de registro."
        layout: "vertical_list"
        items:
          - id: "step_1"
            title: "1. Información de Perfil"
            description: "Datos personales y detalles de tus servicios (precios, zonas)."
          - id: "step_2"
            title: "2. Verificación de DNI"
            description: "Subir foto legible de tu DNI por ambos lados (anverso y reverso)."
          - id: "step_3"
            title: "3. Reconocimiento Facial"
            description: "Escaneo rápido de biometría para validar tu identidad en vivo."
            
      - slot_id: "start_action"
        component: "component.button"
        properties:
          label: "Comenzar Registro"
          action: "navigate_to:waup_walker_profile_form"
          hierarchy: "primary"

spec_version: "1.0.0"
namespace: "waup"

screens:
  # COMPOSICIÓN DE PANTALLA: Listado de Métodos de Cobro del Walker
  waup_payout_list:
    description: "Pantalla donde el paseador visualiza sus cuentas de cobro (bancos y billeteras electrónicas) y puede gestionarlas."
    role: "waup_walker"
    view_state: "waup_payout_methods_list"
    
    layout:
      type: "scroller"
      density: "comfortable"
      background_color: "brand_colors.neutrals.background"
      
    composition:
      - slot_id: "navigation_header"
        pattern: "waup.nav-header"
        properties:
          title: "Métodos de Cobro"
          back_action: "navigate_to:waup_walker_home"
          variant: "ghost"
          
      - slot_id: "payout_methods_vertical_list"
        description: "Lista vertical con las cuentas de banco vinculadas por el paseador."
        layout: "vertical_list"
        items_source: "user.payout_methods"
        items:
          - pattern: "waup.shortcut-card"
            properties:
              title: "{payout.type}"
              description: "{payout.account} • CCI: {payout.cci} • {payout.name}"
              icon: "wallet"
              action: "remove_payout_method"
              
      - slot_id: "add_payout_action"
        description: "Botón principal fijado al pie para agregar una nueva cuenta bancaria."
        component: "component.button"
        properties:
          label: "Agregar Cuenta"
          action: "navigate_to:waup_add_payout"
          hierarchy: "primary"
